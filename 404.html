<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width,initial-scale=1" name="viewport" />
  <title>404 – Page Not Found | Stackly Logistics</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@800&amp;display=swap"
    rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <style>
    :root {
      --teal: #175e60;
      --teal-d: #0b3a3c;
      --yellow: #ffd54a
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 15% 20%, #2a8a8d40, transparent 40%), radial-gradient(circle at 85% 80%, #ffd54a22, transparent 35%), linear-gradient(160deg, #082b2d, #0f4446 55%, #175e60)
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(90deg, #ffffff07 0 1px, transparent 1px 64px), repeating-linear-gradient(0deg, #ffffff07 0 1px, transparent 1px 64px);
      animation: grid 16s linear infinite
    }

    .bar {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px clamp(18px, 4vw, 56px)
    }

    .bar img {
      height: 54px;
      max-width: 200px;
      object-fit: contain;
      display: block
    }

    .bar a.back {
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 18px;
      border: 1px solid #ffffff40;
      border-radius: 30px;
      transition: .3s
    }

    .bar a.back:hover {
      background: var(--yellow);
      color: var(--teal-d);
      border-color: var(--yellow)
    }

    main {
      position: relative;
      z-index: 3;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 20px 90px
    }

    .code {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 2vw, 22px);
      font: 800 clamp(90px, 20vw, 210px)/1 Manrope, sans-serif;
      letter-spacing: -6px;
      animation: rise .8s both
    }

    .code span {
      background: linear-gradient(180deg, #fff, #9fd0d1);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .code .box {
      position: relative;
      width: clamp(70px, 15vw, 160px);
      height: clamp(70px, 15vw, 160px);
      display: grid;
      place-items: center;
      font-size: clamp(44px, 10vw, 100px);
      color: var(--yellow);
      animation: wobble 3s ease-in-out infinite
    }

    .code .box::after {
      content: "";
      position: absolute;
      bottom: -14px;
      width: 70%;
      height: 10px;
      border-radius: 50%;
      background: #0006;
      filter: blur(5px);
      animation: shadow 3s ease-in-out infinite
    }

    .tag {
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--yellow);
      font-weight: 800;
      margin-top: 6px;
      animation: rise .8s .15s both
    }

    h1 {
      font: 800 clamp(26px, 4.2vw, 44px)/1.15 Manrope, sans-serif;
      letter-spacing: -1px;
      margin: 12px 0 10px;
      animation: rise .8s .25s both
    }

    p {
      max-width: 520px;
      color: #cfe3e3;
      line-height: 1.8;
      margin: 0 0 28px;
      animation: rise .8s .35s both
    }

    .acts {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      animation: rise .8s .45s both
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      font: 800 14px 'DM Sans';
      padding: 15px 26px;
      border-radius: 14px;
      border: 0;
      cursor: pointer;
      transition: .3s;
      position: relative;
      overflow: hidden
    }

    .btn.y {
      background: var(--yellow);
      color: var(--teal-d)
    }

    .btn.o {
      background: #ffffff14;
      color: #fff;
      border: 1px solid #ffffff40
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 28px #0005
    }

    .btn.o:hover {
      background: #ffffff26
    }

    .btn i {
      transition: .3s
    }

    .btn:hover i.r {
      transform: translateX(5px)
    }

    .links {
      margin-top: 26px;
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 13px;
      animation: rise .8s .55s both
    }

    .links a {
      color: #9fc4c4;
      text-decoration: none;
      font-weight: 600;
      transition: .25s
    }

    .links a:hover {
      color: var(--yellow)
    }

    .road {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 30px;
      height: 4px;
      background: repeating-linear-gradient(90deg, var(--yellow) 0 26px, transparent 26px 52px);
      opacity: .6;
      animation: road 1s linear infinite
    }

    .truck {
      position: fixed;
      bottom: 38px;
      left: -120px;
      font-size: 46px;
      animation: drive 10s linear infinite;
      z-index: 2
    }

    .truck i {
      display: block;
      animation: bump .5s ease-in-out infinite
    }

    .plane {
      position: fixed;
      top: 18%;
      left: -80px;
      font-size: 30px;
      opacity: .7;
      animation: fly 15s linear infinite
    }

    @keyframes grid {
      to {
        background-position: 64px 64px
      }
    }

    @keyframes road {
      to {
        background-position: -52px 0
      }
    }

    @keyframes drive {
      to {
        left: 105%
      }
    }

    @keyframes fly {
      to {
        left: 108%;
        top: 8%
      }
    }

    @keyframes bump {
      50% {
        transform: translateY(-2px)
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(24px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes wobble {

      0%,
      100% {
        transform: translateY(0) rotate(-6deg)
      }

      50% {
        transform: translateY(-16px) rotate(6deg)
      }
    }

    @keyframes shadow {

      0%,
      100% {
        transform: scale(1);
        opacity: .6
      }

      50% {
        transform: scale(.7);
        opacity: .3
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important
      }
    }

        html, body {

    overflow-x: hidden;

    width: 100%;

}
  </style>
</head>

<body>
  <header class="bar"><a href="index.html" aria-label="Stackly Logistics home"><img src="assets/img/logo.webp"
        alt="Stackly Logistics logo" /></a><a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back
      to website</a></header>
  <i class="fa-solid fa-plane plane" aria-hidden="true"></i>
  <main>
    <div class="code" aria-label="Error 404"><span>4</span>
      <div class="box"><i class="fa-solid fa-box-open"></i></div><span>4</span>
    </div>
    <div class="tag">Error 404 · Shipment not found</div>
    <h1>Oops! This page took a wrong turn.</h1>
    <p>The page you are looking for may have been moved, renamed or is no longer on our route. Let’s get you back on the
      right road.</p>
    <div class="acts">
      <a class="btn y" href="index.html"><i class="fa-solid fa-house"></i> Back to Home <i
          class="fa-solid fa-arrow-right r"></i></a>
      <button class="btn o" onclick="history.length>1?history.back():location.href='index.html'"><i
          class="fa-solid fa-rotate-left"></i> Go Back</button>
    </div>
=
  </main>
  <div class="road" aria-hidden="true"></div>
  <div class="truck" aria-hidden="true"><i class="fa-solid fa-truck-fast"></i></div>
</body>

</html>
